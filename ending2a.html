<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viral Success</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #fef9c3, #ffffff);
    overflow: hidden;
}

/* CONFETTI */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #fbbf24;
    top: -10px;
    animation: fall linear infinite;
}

/* improved animation */
@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.8;
    }
}

.container {
    max-width: 700px;
    margin: 80px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    position: relative;
    z-index: 1;
}

h1 { color: #d97706; }

p { color: #444; line-height: 1.6; }

a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: #f59e0b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>Viral Debut</h1>

<img src="image/viral.jpg" alt="Viral Debut" width="250">

<p>Your debut captures attention instantly. Clips circulate online, your name spreads quickly, and opportunities follow.</p>
<p>With consistency and timing, you turn a moment into momentum.</p>

<p><strong>You become a recognized name in the industry.</strong></p>

<a href="homework8b.html">Play Again</a>

</div>

<script>
for (let i = 0; i < 50; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    
    c.style.left = Math.random() * 100 + "vw";
    
    /* DIFFERENT SPEEDS */
    c.style.animationDuration = (Math.random() * 3 + 2) + "s";
    
    /* STAGGERED START */
    c.style.animationDelay = Math.random() * 5 + "s";
    
    /* RANDOM COLORS */
    c.style.background = ["#fbbf24","#f59e0b","#fde68a","#fcd34d"][Math.floor(Math.random()*4)];
    
    document.body.appendChild(c);
}
</script>

</body>
</html>
