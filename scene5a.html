.container {

.image-box {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    border-radius: 12px;

/* fade in animation */
.image-box img {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;

    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
}

    margin-top: 20px;
    padding: 12px 20px;
