<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solo Artist Direction</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f5f3ff);
}

.container {
    max-width: 850px;
    margin: 60px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    text-align: center;
    animation: fadeIn 1s ease;
}

h1 {
    color: #4a69bd;
}

p {
    color: #444;
    line-height: 1.6;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.card {
    padding: 25px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    transition: 0.25s;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.card:hover {
    transform: scale(1.05);
}

/* SOLO CONCEPTS */
.gc { background: linear-gradient(135deg, #111827, #4b5563); }
.y2k { background: linear-gradient(135deg, #f472b6, #a78bfa); }
.rnb { background: linear-gradient(135deg, #1f2937, #60a5fa); }
.pop { background: linear-gradient(135deg, #fbbf24, #fb7185); }

.back {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 20px;
    background: #9ca3af;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

<div class="container">

<h1>Design Your Debut Era 🎤</h1>

<p>The label is shaping your identity as a solo artist. This is your debut direction.</p>

<div class="grid">

<a href="ending2.html" class="card gc" onclick="document.getElementById('clickSound').play()">
Girl / Boy Crush
</a>

<a href="ending2.html" class="card y2k" onclick="document.getElementById('clickSound').play()">
Y2K Pop
</a>

<a href="ending2.html" class="card rnb" onclick="document.getElementById('clickSound').play()">
R&B / Soul
</a>

<a href="ending2.html" class="card pop" onclick="document.getElementById('clickSound').play()">
Pop Star
</a>

</div>

<a class="back" href="scene1b.html">Go Back</a>

</div>

</body>
</html>
